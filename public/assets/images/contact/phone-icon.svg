<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- White rounded square with shadow -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- Main rounded square -->
  <rect x="20" y="20" width="80" height="80" rx="20" ry="20" fill="white" filter="url(#shadow)"/>
  
  <!-- Top horizontal line -->
  <rect x="35" y="35" width="50" height="3" rx="1.5" fill="#E5E7EB"/>
  
  <!-- Bottom horizontal line -->
  <rect x="35" y="82" width="50" height="3" rx="1.5" fill="#E5E7EB"/>
  
  <!-- Vertical line extending down -->
  <rect x="58" y="100" width="4" height="15" rx="2" fill="white"/>
  
  <!-- Curved arc at bottom -->
  <path d="M 60 115 Q 70 125 80 115" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>

