<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Connection Test - FundGrow Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .test-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .debug-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .status-success {
            color: #28a745;
            font-weight: bold;
        }
        .status-error {
            color: #dc3545;
            font-weight: bold;
        }
        .status-warning {
            color: #ffc107;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="test-card">
                    <h2 class="text-center mb-4">🔗 Wallet Connection Test</h2>
                    
                    <div class="debug-info" id="debugInfo">
                        <strong>Debug Information:</strong><br>
                        <span id="debugContent">Loading...</span>
                    </div>
                    
                    <div class="text-center mb-4">
                        <button class="btn btn-primary btn-lg" onclick="testWalletConnection()">
                            🔗 Test Wallet Connection
                        </button>
                    </div>
                    
                    <div id="connectionResult" class="mb-4"></div>
                    
                    <div class="text-center">
                        <button class="btn btn-success me-2" onclick="connectTrustWallet()">
                            🦊 Connect Trust Wallet
                        </button>
                        <button class="btn btn-info" onclick="connectMobileWallet()">
                            📱 Connect Mobile Wallet
                        </button>
                    </div>
                    
                    <div id="walletStatus" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Ethers.js -->
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
    <!-- Load our wallet service -->
    <script src="/js/wallet-service.js"></script>
    
    <script>
        let debugContent = '';
        
        function updateDebugInfo() {
            const info = {
                userAgent: navigator.userAgent,
                isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
                ethereumAvailable: typeof window.ethereum !== 'undefined',
                walletType: window.walletService ? window.walletService.detectWalletType() : 'unknown',
                timestamp: new Date().toLocaleString()
            };
            
            if (window.ethereum) {
                info.isTrust = window.ethereum.isTrust;
                info.isMetaMask = window.ethereum.isMetaMask;
                info.isCoinbase = window.ethereum.isCoinbaseWallet;
            }
            
            debugContent = Object.entries(info)
                .map(([key, value]) => `${key}: ${value}`)
                .join('<br>');
            
            document.getElementById('debugContent').innerHTML = debugContent;
        }
        
        async function testWalletConnection() {
            const resultDiv = document.getElementById('connectionResult');
            resultDiv.innerHTML = '<div class="alert alert-info">Testing wallet connection...</div>';
            
            try {
                const result = await window.walletService.connectWallet();
                
                if (result.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <strong>✅ Connection Successful!</strong><br>
                            Account: ${result.account}<br>
                            Wallet Type: ${result.walletType || 'Unknown'}
                        </div>
                    `;
                    
                    document.getElementById('walletStatus').innerHTML = `
                        <div class="debug-info">
                            <strong>Connected Wallet Details:</strong><br>
                            Account: ${result.account}<br>
                            Wallet Type: ${result.walletType || 'Unknown'}<br>
                            Provider: ${window.walletService.provider ? 'Available' : 'Not Available'}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <strong>❌ Connection Failed!</strong><br>
                            Error: ${result.error}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>❌ Connection Error!</strong><br>
                        Error: ${error.message}
                    </div>
                `;
            }
            
            updateDebugInfo();
        }
        
        // Listen for wallet connection events
        window.addEventListener('walletConnected', function(event) {
            const { account, walletType } = event.detail;
            document.getElementById('walletStatus').innerHTML = `
                <div class="alert alert-success">
                    <strong>🎉 Wallet Connected via Event!</strong><br>
                    Account: ${account}<br>
                    Wallet Type: ${walletType}
                </div>
            `;
        });
        
        window.addEventListener('walletConnectionFailed', function(event) {
            const { error } = event.detail;
            document.getElementById('walletStatus').innerHTML = `
                <div class="alert alert-danger">
                    <strong>💥 Wallet Connection Failed via Event!</strong><br>
                    Error: ${error}
                </div>
            `;
        });
        
        // Update debug info on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateDebugInfo();
            
            // Check if wallet is already connected
            if (window.ethereum && window.ethereum.selectedAddress) {
                document.getElementById('walletStatus').innerHTML = `
                    <div class="alert alert-info">
                        <strong>ℹ️ Wallet Already Connected</strong><br>
                        Account: ${window.ethereum.selectedAddress}
                    </div>
                `;
            }
        });
        
        // Update debug info every 5 seconds
        setInterval(updateDebugInfo, 5000);
    </script>
</body>
</html>
